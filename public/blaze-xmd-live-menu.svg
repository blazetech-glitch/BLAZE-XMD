<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">BLAZE XMD live menu</title>
  <desc id="desc">A premium animated BLAZE XMD system card with a live Nairobi clock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/><stop offset="0.52" stop-color="#111d3b"/><stop offset="1" stop-color="#25103b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e8ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4fbff"/><stop offset="1" stop-color="#b8c9ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .float { animation: float 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scan { animation: scan 4.5s ease-in-out infinite; }
      .hand { transform-origin: 900px 360px; animation: tick 60s steps(60) infinite; }
      @keyframes float { 0%,100% { transform: translate(0,0); opacity:.22 } 50% { transform: translate(0,-18px); opacity:.52 } }
      @keyframes pulse { 0%,100% { opacity:.42; transform:scale(.94) } 50% { opacity:1; transform:scale(1.08) } }
      @keyframes scan { 0%,100% { transform:translateX(-300px); opacity:0 } 20%,75% { opacity:.8 } 90% { transform:translateX(900px); opacity:0 } }
      @keyframes tick { to { transform:rotate(360deg) } }
    </style>
    <script><![CDATA[
      (function(){
        function pad(n){return String(n).padStart(2,'0')}
        function update(){
          var d=new Date(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
          var clock=document.getElementById('clock');
          var date=document.getElementById('date');
          if(clock) clock.textContent=pad(h)+':'+pad(m)+':'+pad(s);
          if(date) date.textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()+'  ·  AFRICA/Nairobi';
        }
        update(); setInterval(update,1000);
      }());
    ]]></script>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle class="float" cx="1040" cy="90" r="210" fill="#43e8ff" opacity=".12" filter="url(#soft)"/>
  <circle class="float" cx="170" cy="600" r="190" fill="#ff4d8d" opacity=".12" filter="url(#soft)"/>
  <path d="M0 155H1200M0 520H1200" stroke="#fff" stroke-opacity=".05"/>
  <rect x="34" y="34" width="1132" height="607" rx="30" fill="none" stroke="url(#edge)" stroke-opacity=".72" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="5" rx="2.5" fill="url(#edge)"/>
  <g transform="translate(92 105)">
    <circle class="pulse" cx="20" cy="16" r="11" fill="#55f6b2" filter="url(#glow)"/>
    <text x="52" y="26" fill="#a9b9d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="5">SYSTEM ONLINE</text>
    <text x="0" y="118" fill="url(#type)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="8">BLAZE XMD</text>
    <text x="4" y="161" fill="#7f92b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="3">COMMAND INTELLIGENCE · BUILT FOR WHATSAPP</text>
    <rect class="scan" x="0" y="190" width="3" height="118" fill="#43e8ff" opacity=".65"/>
    <text x="0" y="264" fill="#6880ad" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="3">LIVE CONTROL SURFACE / 01</text>
  </g>
  <g transform="translate(720 150)">
    <circle cx="180" cy="180" r="148" fill="#0b1228" stroke="#354d80" stroke-width="2"/>
    <circle cx="180" cy="180" r="132" fill="none" stroke="url(#edge)" stroke-opacity=".45" stroke-width="3" stroke-dasharray="3 15"/>
    <g stroke="#d9e6ff" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M180 49v15M180 296v15M49 180h15M296 180h15"/>
    </g>
    <g class="hand" stroke="#eaf4ff" stroke-linecap="round"><path d="M180 180V92" stroke-width="6"/><path d="M180 180L245 218" stroke="#43e8ff" stroke-width="4"/></g>
    <circle cx="180" cy="180" r="8" fill="#43e8ff" filter="url(#glow)"/>
    <text id="clock" x="180" y="375" text-anchor="middle" fill="#eef6ff" font-family="ui-monospace,Menlo,monospace" font-size="36" font-weight="700" letter-spacing="4">00:00:00</text>
    <text id="date" x="180" y="407" text-anchor="middle" fill="#8094bb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">LIVE  ·  AFRICA/NAIROBI</text>
  </g>
  <g transform="translate(92 520)" fill="#93a8d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="2">
    <text x="0" y="0">FAST</text><text x="105" y="0">SECURE</text><text x="245" y="0">MODULAR</text>
    <circle cx="84" cy="-6" r="2.5" fill="#43e8ff"/><circle cx="224" cy="-6" r="2.5" fill="#8b5cf6"/>
  </g>
  <text x="1108" y="580" text-anchor="end" fill="#53698f" font-family="ui-monospace,Menlo,monospace" font-size="14" letter-spacing="2">BLAZE-TECH / LIVE MENU</text>
</svg>
