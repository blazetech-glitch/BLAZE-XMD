<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BLAZE-XMD by ARNOLDT20</title>
  <desc id="desc">Animated BLAZE-XMD WhatsApp automation bot logo created by ARNOLDT20</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#102a43"/>
      <stop offset="1" stop-color="#183b56"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="0.5" stop-color="#ffad00"/>
      <stop offset="1" stop-color="#fff1a6"/>
      <animate attributeName="x1" values="0;0.35;0" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ee7ff"/>
    </linearGradient>
    <linearGradient id="credit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
      <animate attributeName="x1" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="luminous" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="tight"/>
      <feColorMatrix in="wide" type="matrix" values="1 0 0 0 0.08  0 0.72 0 0 0.04  0 0 0.35 0 0  0 0 0 0.82 0" result="warmWide"/>
      <feMerge>
        <feMergeNode in="warmWide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .brand { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .flicker { animation: flicker 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
      .float-a { animation: floatA 2.8s ease-in-out infinite; }
      .float-b { animation: floatB 3.4s ease-in-out infinite; }
      .credit { animation: creditGlow 2.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .48; transform: scale(.94); } 50% { opacity: .9; transform: scale(1.08); } }
      @keyframes flicker { 0% { transform: scaleY(.94) rotate(-2deg); } 100% { transform: scaleY(1.06) rotate(2deg); } }
      @keyframes floatA { 0%,100% { transform: translate(0, 0); opacity: .35; } 50% { transform: translate(-8px, -22px); opacity: 1; } }
      @keyframes floatB { 0%,100% { transform: translate(0, 0); opacity: .3; } 50% { transform: translate(11px, -28px); opacity: .95; } }
      @keyframes creditGlow { 0%,100% { opacity: .72; letter-spacing: 4px; } 50% { opacity: 1; letter-spacing: 6px; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .flicker, .float-a, .float-b, .credit { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="520" rx="42" fill="url(#bg)"/>
  <circle class="pulse" cx="930" cy="-10" r="220" fill="#2dd4bf" opacity=".14" filter="url(#glow)"/>
  <circle class="pulse" cx="1100" cy="430" r="250" fill="#ff7a45" opacity=".14" filter="url(#glow)"/>
  <path d="M0 454 C220 414 382 494 622 448 S1010 411 1200 446" fill="none" stroke="#2dd4bf" stroke-opacity=".16" stroke-width="2"/>

  <g transform="translate(82 53)" filter="url(#shadow)">
    <circle class="pulse" cx="116" cy="147" r="104" fill="#ffb000" opacity=".34" filter="url(#luminous)"/>
    <g class="flicker" filter="url(#luminous)">
      <path d="M116 4c18 53-12 74-37 99-22 22-30 44-20 67 8 18 27 30 49 30 39 0 69-30 69-70 0-32-17-63-61-126z" fill="url(#fire)"/>
      <path d="M93 105c-25 25-39 46-33 67 5 17 18 28 36 28 27 0 47-22 47-48 0-17-9-34-28-55-5 14-10 18-22 8z" fill="#fff4c2" opacity=".94"/>
    </g>
    <circle class="float-a" cx="76" cy="220" r="5" fill="#ff6b35"/>
    <circle class="float-b" cx="155" cy="216" r="6" fill="#ffe08a"/>
    <circle class="float-a" cx="115" cy="236" r="8" fill="#ffb000"/>
  </g>

  <g class="brand" transform="translate(310 0)">
    <text x="0" y="178" fill="url(#word)" font-size="104" font-weight="800" letter-spacing="6">BLAZE</text>
    <text x="410" y="178" fill="#ffb000" font-size="104" font-weight="800" letter-spacing="2">-XMD</text>
    <rect x="5" y="212" width="520" height="4" rx="2" fill="#2dd4bf" opacity=".72">
      <animate attributeName="width" values="360;540;360" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="5" y="263" fill="#c9e8f3" font-size="25" font-weight="500" letter-spacing="5">WHATSAPP AUTOMATION</text>
    <text x="5" y="302" fill="#8fb5c6" font-size="18" letter-spacing="2">FAST  •  MODERN  •  RELIABLE</text>
    <text class="credit" x="5" y="430" fill="url(#credit)" font-size="22" font-weight="800" letter-spacing="4">CRAFTED BY ARNOLDT20</text>
  </g>
</svg>
